<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Block styles</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      [hidden] {
        display: none !important;
      }
      html,
      body {
        margin: 0;
        background: #2a2b30;
        color: #eee;
        font:
          14px Inter,
          system-ui,
          sans-serif;
      }
      main {
        padding: 32px;
        max-width: 1200px;
        margin: 0 auto;
      }
      h1 {
        margin: 0 0 6px;
      }
      p {
        color: #aaa;
        margin: 0 0 24px;
      }
      .cols {
        display: grid;
        grid-template-columns: 140px repeat(4, 1fr);
        gap: 1px;
        background: #444;
        border-radius: 12px;
        overflow: hidden;
      }
      .cols > div {
        padding: 10px;
        display: flex;
        gap: 10px;
        align-items: center;
        justify-content: center;
      }
      .cols .hd {
        background: #1b1c20;
        font-weight: 600;
      }
      .cols .rh {
        background: #1b1c20;
        justify-content: flex-start;
      }
      .cell canvas {
        width: 56px;
        height: 56px;
      }
      .cell small {
        color: inherit;
        opacity: 0.55;
        font-size: 11px;
        width: 24px;
      }
      .live {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
        margin-top: 28px;
      }
      .live figure {
        margin: 0;
        border-radius: 12px;
        overflow: hidden;
        position: relative;
      }
      .live canvas {
        width: 100%;
        height: 300px;
        display: block;
        cursor: crosshair;
      }
      .live figcaption {
        position: absolute;
        top: 8px;
        left: 10px;
        background: rgba(0, 0, 0, 0.6);
        padding: 2px 8px;
        border-radius: 6px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Block visual styles</h1>
      <p>
        Each block off/on in four styles, then the same live demo circuit in each. Lamps, torches
        and the clock animate. Drag to pan, wheel to zoom, right click a lever.
      </p>
      <div class="cols" id="table"></div>
      <div class="live" id="live"></div>
    </main>
    <script src="shared.js"></script>
    <script>
      const styles = [
        ['pixel', 'Pixel (current)'],
        ['flat', 'Flat / paper'],
        ['blueprint', 'Blueprint schematic'],
        ['neon', 'Neon'],
      ];
      const t = document.getElementById('table');
      t.insertAdjacentHTML(
        'beforeend',
        '<div class="hd"></div>' + styles.map(([, n]) => `<div class="hd">${n}</div>`).join(''),
      );
      for (const type of Ruda.TYPES) {
        t.insertAdjacentHTML('beforeend', `<div class="rh">${Ruda.NAMES[type]}</div>`);
        for (const [s] of styles) {
          const d = document.createElement('div');
          d.className = 'cell';
          d.style.background = Ruda.STYLES[s].bg;
          d.style.color = s === 'flat' ? '#000' : '#fff';
          d.innerHTML = '<small>off</small><canvas></canvas><canvas></canvas><small>on</small>';
          t.append(d);
          const [a, b] = d.querySelectorAll('canvas');
          Ruda.drawIcon(a, type, s, false);
          Ruda.drawIcon(b, type, s, true);
        }
      }
      const live = document.getElementById('live');
      for (const [s, n] of styles) {
        const f = document.createElement('figure');
        f.innerHTML = `<canvas></canvas><figcaption>${n}</figcaption>`;
        live.append(f);
        const v = new Ruda.WorldView(f.querySelector('canvas'), { style: s, zoom: 22 });
        v.tool = 'wire';
      }
    </script>
  </body>
</html>
