<!doctype html>
<meta charset="utf-8" />
<title>Ruda – world selection mockups</title>
<link rel="stylesheet" href="shared.css" />
<style>
  .dim { position: absolute; inset: 0; background: rgba(8, 9, 12, 0.72); }
  .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding: 56px 32px 24px; gap: 16px; }
  h1 { font: 40px 'Silkscreen', monospace; margin: 0; text-shadow: 3px 3px #000; }
  .bar { display: flex; gap: 10px; align-items: center; width: min(1100px, 100%); }
  .bar .search { flex: 1; padding: 4px 10px; border: 3px solid #000; background: #0c0d10; color: #eee; font: 24px 'VT323', monospace; box-shadow: inset 0 0 0 2px #444; }
  .hint { color: #9aa; font-size: 20px; }

  /* A – grid of cards */
  .grid { width: min(1100px, 100%); display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; overflow: auto; padding: 4px; }
  .card { position: relative; padding: 8px; cursor: pointer; }
  .card:hover, .card.focus { outline: 3px solid #fff; }
  .card .name { margin-top: 6px; font-size: 26px; border-bottom: 2px dashed transparent; }
  .card .name:hover { border-bottom-color: #888; cursor: text; }
  .card .meta { color: #9aa; font-size: 18px; }
  .card .del { position: absolute; top: 14px; right: 14px; opacity: 0; }
  .card:hover .del, .card.focus .del { opacity: 1; }
  .card.new { display: grid; place-items: center; min-height: 200px; border-style: dashed; color: #ccc; font-size: 28px; text-align: center; }

  /* B – list + big preview */
  .split { width: min(1200px, 100%); flex: 1; display: grid; grid-template-columns: 380px 1fr; gap: 16px; min-height: 0; }
  .list { overflow: auto; padding: 6px; display: flex; flex-direction: column; gap: 4px; }
  .row { display: grid; grid-template-columns: 72px 1fr; gap: 10px; align-items: center; padding: 4px; cursor: pointer; }
  .row .thumb { border-width: 2px; }
  .row.sel { background: #2b3360; outline: 2px solid #a9b1ee; }
  .row:hover { background: #22252c; }
  .row small { display: block; color: #9aa; font-size: 18px; }
  .preview { padding: 16px; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .preview canvas { flex: 1; width: 100%; min-height: 0; border: 3px solid #000; }
  .preview .title { font-size: 40px; border-bottom: 2px dashed #666; align-self: flex-start; }
  .preview .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .preview .actions .play { font-size: 32px; padding: 6px 28px; background: #3d7a3d; box-shadow: inset -3px -3px 0 #285228, inset 3px 3px 0 #63a863; }

  /* C – shelf on the start screen */
  .start { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; }
  .start .logo { font-size: 110px; }
  .shelf { display: flex; gap: 18px; padding: 10px 40px; overflow-x: auto; max-width: 100%; scroll-snap-type: x mandatory; }
  .shelf .card { width: 240px; flex: none; scroll-snap-align: center; }
  .shelf .card.big { width: 320px; outline: 3px solid #ffd34d; }
  .start .row-btns { display: flex; gap: 12px; }
</style>

<div class="switcher">
  <button data-show="a">A · mřížka kartiček</button>
  <button data-show="b">B · seznam + velký náhled</button>
  <button data-show="c">C · police na úvodní obrazovce</button>
</div>

<!-- A -->
<section class="variant" id="a">
  <canvas class="bg" data-world="11"></canvas>
  <div class="dim"></div>
  <div class="center">
    <h1>Worlds</h1>
    <div class="bar">
      <button class="btn">◀ Back <kbd>Esc</kbd></button>
      <input class="search" placeholder="Search worlds…  ( / )" />
      <button class="btn">Import</button>
    </div>
    <div class="grid" id="grid-a"></div>
    <div class="hint">Klik na kartičku = hrát · klik na název = přejmenovat · šipky + Enter · <kbd>F2</kbd> přejmenovat · <kbd>Del</kbd> smazat · <kbd>E</kbd> export</div>
  </div>
</section>

<!-- B -->
<section class="variant" id="b">
  <canvas class="bg" data-world="12"></canvas>
  <div class="dim"></div>
  <div class="center">
    <h1>Worlds</h1>
    <div class="bar">
      <button class="btn">◀ Back <kbd>Esc</kbd></button>
      <input class="search" placeholder="Search worlds…" />
      <button class="btn">+ New world</button>
      <button class="btn">Import</button>
    </div>
    <div class="split">
      <div class="list panel" id="list-b"></div>
      <div class="preview panel">
        <span class="title">Light chaser</span>
        <span class="hint">Saved 2 hours ago · 214 blocks</span>
        <canvas data-world="5" data-cell="40"></canvas>
        <div class="actions">
          <button class="btn play">▶ Play <kbd>Enter</kbd></button>
          <button class="btn">Export</button>
          <button class="btn">Duplicate</button>
          <button class="btn">🗑 Delete</button>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- C -->
<section class="variant" id="c">
  <canvas class="bg" data-world="13"></canvas>
  <div class="dim" style="background: rgba(8, 9, 12, 0.45)"></div>
  <div class="start">
    <div class="logo">RUDA</div>
    <div class="shelf" id="shelf-c"></div>
    <div class="row-btns">
      <button class="btn">Import</button>
      <button class="btn">Controls</button>
    </div>
    <div class="hint">Úvodní obrazovka = výběr světa. Šipky ◀ ▶ vybírají, Enter hraje. Zvýrazněný je poslední svět.</div>
  </div>
</section>

<script src="shared.js"></script>
<script>
  const worlds = [
    ['Light chaser', '2 hours ago'], ['Adder 2-bit', 'yesterday'], ['My first clock', '3 days ago'],
    ['Piston door', 'last week'], ['Logic gates', 'last week'], ['Lamp sign', 'Oct 2'], ['Untitled 3', 'Sep 28'],
  ];
  const card = (name, when, seed, extra = '') => `
    <div class="card panel ${extra}">
      <canvas class="thumb" data-world="${seed}" data-cell="12"></canvas>
      <div class="name">${name}</div>
      <div class="meta">${when}</div>
      <button class="btn small del" title="Delete">🗑</button>
    </div>`;
  document.getElementById('grid-a').innerHTML =
    `<div class="card panel new">+<br/>New world</div>` +
    worlds.map(([n, w], i) => card(n, w, i + 20, i === 0 ? 'focus' : '')).join('');
  document.getElementById('list-b').innerHTML = worlds
    .map(([n, w], i) => `<div class="row ${i === 0 ? 'sel' : ''}"><canvas class="thumb" data-world="${i + 20}" data-cell="6"></canvas><div>${n}<small>${w}</small></div></div>`)
    .join('');
  document.getElementById('shelf-c').innerHTML =
    `<div class="card panel new" style="width:200px;flex:none">+<br/>New world</div>` +
    worlds.map(([n, w], i) => card(n, w, i + 20, i === 0 ? 'big' : '')).join('');
  variantSwitcher();
</script>
